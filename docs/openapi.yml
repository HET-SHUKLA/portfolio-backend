# ==============================================================
# COMPONENTS
# ==============================================================

components:

  # ------------------------------------------------------------
  # SECURITY
  # ------------------------------------------------------------

  securitySchemes:

    AdminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-token
      description: |
        Temporary administrative bearer token.

        The token must be provided using:

        Authorization: Bearer <admin-token>


  # ------------------------------------------------------------
  # PARAMETERS
  # ------------------------------------------------------------

  parameters:

    ResourceId:
      name: id
      in: path
      required: true
      description: Unique identifier of the resource.
      schema:
        type: integer
        minimum: 1


  # ------------------------------------------------------------
  # NAVBAR
  # ------------------------------------------------------------

  schemas:

    NavbarItem:
      type: object
      required:
        - title
        - link
      properties:
        title:
          type: string

        link:
          type: string


    NavbarInput:
      type: object
      required:
        - left
        - right
      properties:
        left:
          type: array
          items:
            $ref: "#/components/schemas/NavbarItem"

        right:
          type: array
          items:
            $ref: "#/components/schemas/NavbarItem"


  # ------------------------------------------------------------
  # USER DATA
  # ------------------------------------------------------------

    UserDataInput:
      type: object
      required:
        - name
        - role
        - description
        - customData
      properties:
        name:
          type: string

        role:
          type: string

        description:
          type: array
          items:
            type: string

        customData:
          type:
            - array
            - "null"
          items:
            type: string


  # ------------------------------------------------------------
  # EXPERIENCE
  # ------------------------------------------------------------

    ExperienceInput:
      type: object
      required:
        - startDate
        - endDate
        - role
        - company
        - location
        - description
        - customData
      properties:
        startDate:
          type: string
          format: date

        endDate:
          type:
            - string
            - "null"
          format: date

        role:
          type: string

        company:
          type:
            - string
            - "null"

        location:
          type:
            - string
            - "null"

        description:
          type: array
          items:
            type: string

        customData:
          type:
            - array
            - "null"
          items:
            type: string


    Experience:
      allOf:
        - $ref: "#/components/schemas/ExperienceInput"
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
              minimum: 1


  # ------------------------------------------------------------
  # PROJECTS
  # ------------------------------------------------------------

    ProjectInput:
      type: object
      required:
        - name
        - code
        - live
        - description
        - images
        - tools
        - technologies
        - languages
        - customData
      properties:
        name:
          type: string

        code:
          type:
            - string
            - "null"

        live:
          type:
            - string
            - "null"

        description:
          type: array
          items:
            type: string

        images:
          type:
            - array
            - "null"
          items:
            type: string

        tools:
          type:
            - array
            - "null"
          items:
            type: string

        technologies:
          type:
            - array
            - "null"
          items:
            type: string

        languages:
          type:
            - array
            - "null"
          items:
            type: string

        customData:
          type:
            - array
            - "null"
          items:
            type: string


    Project:
      allOf:
        - $ref: "#/components/schemas/ProjectInput"
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
              minimum: 1


  # ------------------------------------------------------------
  # SKILLS
  # ------------------------------------------------------------

    SkillsInput:
      type: array
      items:
        type: string


  # ------------------------------------------------------------
  # CONTACT
  # ------------------------------------------------------------

    ContactSocial:
      type: object
      required:
        - name
        - link
      properties:
        name:
          type: string

        link:
          type: string


    ContactInput:
      type: object
      required:
        - email
        - socials
      properties:
        email:
          type:
            - array
            - "null"
          items:
            type: string
            format: email

        socials:
          type: array
          items:
            $ref: "#/components/schemas/ContactSocial"


  # ------------------------------------------------------------
  # CUSTOM DATA
  # ------------------------------------------------------------

    CustomDataInput:
      type: array
      items:
        type: string


  # ------------------------------------------------------------
  # VERSION
  # ------------------------------------------------------------

    VersionData:
      type: object
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 0


  # ------------------------------------------------------------
  # PORTFOLIO DATA
  # ------------------------------------------------------------

    PortfolioData:
      type: object
      required:
        - navbar
        - userData
        - experience
        - projects
        - skills
        - contact
        - customData
      properties:

        navbar:
          $ref: "#/components/schemas/NavbarInput"

        userData:
          $ref: "#/components/schemas/UserDataInput"

        experience:
          type: array
          items:
            $ref: "#/components/schemas/Experience"

        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"

        skills:
          type: array
          items:
            type: string

        contact:
          $ref: "#/components/schemas/ContactInput"

        customData:
          type: array
          items:
            type: string


  # ------------------------------------------------------------
  # COMMON RESPONSE BASE
  # ------------------------------------------------------------

    SuccessResponse:
      type: object
      required:
        - status
        - code
        - message
      properties:
        status:
          type: string
          enum:
            - SUCCESS

        code:
          type: integer
          const: 200

        message:
          type: string


    CreatedResponse:
      type: object
      required:
        - status
        - code
        - message
      properties:
        status:
          type: string
          enum:
            - SUCCESS

        code:
          type: integer
          const: 201

        message:
          type: string


    FailureResponse:
      type: object
      required:
        - status
        - code
        - message
      properties:
        status:
          type: string
          enum:
            - FAILURE

        code:
          type: integer
          enum:
            - 400
            - 401
            - 403
            - 404
            - 409
            - 500

        message:
          type: string


