# ==============================================================
# COMMON RESPONSES
# ==============================================================

  responses:

    BadRequest:
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FailureResponse"
          example:
            status: FAILURE
            code: 400
            message: Invalid request data


    Unauthorized:
      description: |
        Unauthorized request.

        For public APIs, this indicates that the request did not originate
        through an authorized CDN path or failed origin-access validation.

        For admin APIs, this indicates that the administrative bearer token
        is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FailureResponse"
          example:
            status: FAILURE
            code: 401
            message: Unauthorized


    Forbidden:
      description: |
        The request was authenticated but is not authorized to perform
        the requested administrative operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FailureResponse"
          example:
            status: FAILURE
            code: 403
            message: Forbidden


    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FailureResponse"
          example:
            status: FAILURE
            code: 404
            message: Resource not found


    Conflict:
      description: Resource already exists or conflicts with current state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FailureResponse"
          example:
            status: FAILURE
            code: 409
            message: Resource already exists


    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FailureResponse"
          example:
            status: FAILURE
            code: 500
            message: Internal server error


    DeleteSuccess:
      description: Resource deleted successfully
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SuccessResponse"
          example:
            status: SUCCESS
            code: 200
            message: Resource deleted successfully