openapi: 3.1.0

info:
  title: Portfolio Backend API
  version: 1.0.0
  description: |
    Production API for the portfolio application.

    The public API provides portfolio content and synchronization information.
    The administrative API provides authenticated CRUD operations for managing
    portfolio content.

servers:
  - url: https://api.example.com/api/v1
    description: Production

tags:
  - name: Public
    description: Public portfolio APIs
  - name: Admin
    description: Administrative portfolio APIs

paths:

  # ============================================================
  # PUBLIC API
  # ============================================================

  /version:
    get:
      tags:
        - Public
      summary: Get current portfolio version
      operationId: getVersion

      description: |
        Returns the current portfolio content version.

        The frontend compares this value with the version embedded in the
        static frontend. If the versions differ, the frontend requests
        the complete portfolio from /portfolio.

        This endpoint is intended to be cached by the CDN.

      responses:
        "200":
          description: Portfolio version retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
              example:
                status: SUCCESS
                code: 200
                message: Version retrieved successfully
                data:
                  version: 17

        "401":
          $ref: "#/components/responses/Unauthorized"

        "500":
          $ref: "#/components/responses/InternalServerError"


  /portfolio:
    get:
      tags:
        - Public
      summary: Get complete portfolio
      operationId: getPortfolio

      description: |
        Returns the complete public portfolio snapshot.

        The frontend should request this endpoint only when its locally
        embedded portfolio version differs from the backend version.

      responses:
        "200":
          description: Complete portfolio retrieved successfully
          headers:
            ETag:
              description: Entity tag representing this portfolio representation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioResponse"

        "304":
          description: |
            The portfolio has not changed.

            The server returns 304 when the client's cached representation
            is still valid. A 304 response does not contain a response body.
          headers:
            ETag:
              description: Entity tag representing the current portfolio.
              schema:
                type: string

        "401":
          $ref: "#/components/responses/Unauthorized"

        "500":
          $ref: "#/components/responses/InternalServerError"


  /experience:
    get:
      tags:
        - Public
      summary: Get all work experience
      operationId: getExperience

      responses:
        "200":
          description: Experience retrieved successfully
          content:
            application/json:
              schema:
